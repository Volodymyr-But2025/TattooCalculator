<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- iOS Safari Specific Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Тату Кальк" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>Tattoo Price Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- UI Елемент сповіщення (прихований за замовчуванням) -->
    <div
      id="pwa-update-toast"
      style="
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #1e1b4b;
        color: #ffffff;
        padding: 16px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        gap: 16px;
        z-index: 9999;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        border: 1px solid #4f46e5;
      "
    >
      <span style="font-size: 14px; font-weight: 500"
        >Доступна нова версія калькулятора!</span
      >
      <button
        id="pwa-refresh-btn"
        style="
          background: #4f46e5;
          color: white;
          border: none;
          padding: 8px 14px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          font-size: 13px;
          transition: background 0.2s;
        "
      >
        Оновити
      </button>
    </div>

    <!-- Розумна реєстрація Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          let refreshing = false;

          // Автоматично перезавантажуємо сторінку, коли новий SW активується і бере керування
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => {
              console.log("SW Registered:", reg.scope);

              // Функція активації банера
              const showUpdateBanner = (waitingWorker) => {
                const toast = document.getElementById("pwa-update-toast");
                const btn = document.getElementById("pwa-refresh-btn");

                toast.style.display = "flex";
                btn.addEventListener("click", () => {
                  // Надсилаємо команду SKIP_WAITING у сервіс-воркер
                  waitingWorker.postMessage({ type: "SKIP_WAITING" });
                });
              };

              // Ситуація 1: Оновлення вже завантажене і чекає з минулого візиту
              if (reg.waiting) {
                showUpdateBanner(reg.waiting);
              }

              // Ситуація 2: Оновлення знайдено та завантажується прямо зараз
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                newWorker.addEventListener("statechange", () => {
                  // Показуємо банер лише тоді, коли файл повністю завантажився (installed)
                  // і додаток вже мав старий активний воркер (щоб не показувати при першому візиті)
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    showUpdateBanner(newWorker);
                  }
                });
              });

              // Перевіряємо наявність оновлень на сервері щоразу при запуску
              reg.update();
            })
            .catch((err) => console.log("SW Registration failed:", err));
        });
      }
    </script>
  </body>
</html>
