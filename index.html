<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-source.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Тату Кальк" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tattoo Price Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <div
      id="pwa-update-toast"
      style="
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #1e1b4b;
        color: #ffffff;
        padding: 16px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        gap: 16px;
        z-index: 9999;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        border: 1px solid #4f46e5;
      "
    >
      <span style="font-size: 14px; font-weight: 500"
        >Доступна нова версія калькулятора!</span
      >
      <button
        id="pwa-refresh-btn"
        style="
          background: #4f46e5;
          color: white;
          border: none;
          padding: 8px 14px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          font-size: 13px;
        "
      >
        Оновити
      </button>
    </div>
  </body>
</html>
